[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mod2mov"
version = "1.1.0"
description = "Convert camcorder .MOD files to .mov, renamed in shooting order with dates preserved"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Arman Arutiunov" }]
keywords = ["video", "ffmpeg", "camcorder", "mod", "deinterlace", "mpeg2"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Conversion",
]

# No hard dependencies: the tool drives a system ffmpeg, which install.sh
# offers to install for you. The optional extra bundles a static ffmpeg for
# machines where installing one isn't practical.
dependencies = []

[project.optional-dependencies]
bundled = ["imageio-ffmpeg>=0.4.9"]

[project.urls]
Homepage = "https://github.com/armanarutiunov/mod2mov"

[project.scripts]
mod2mov = "mod2mov:main"

[tool.setuptools]
py-modules = ["mod2mov"]
